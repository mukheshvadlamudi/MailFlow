<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">MailFlow · logical architecture</title><desc id="desc">A sample-inbox application with a Python API, local storage, and external inference. Selected email content and prompts go to Groq. This demo has no user authentication or tenant isolation. Draft CRUD stores user-reviewed text in SQLite; no outbound email delivery is implemented.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#80909b"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="620" rx="0" fill="#ffffff" stroke="#ffffff"/><text x="48" y="59" fill="#17212b" font-size="32" font-weight="650" text-anchor="start">MailFlow · logical architecture</text><text x="48" y="94" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">A sample-inbox application with a Python API, local storage, and external inference.</text><rect x="48" y="160" width="260" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="68" y="196" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">React interface</text><text x="68" y="225" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Inbox, prompts, chat, drafts</text><text x="68" y="250" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Vite development server</text><rect x="388" y="160" width="350" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="408" y="196" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">FastAPI routes</text><text x="408" y="225" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Emails, processing, agent, drafts</text><text x="408" y="250" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">SQLAlchemy data access</text><rect x="818" y="160" width="410" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="838" y="196" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Groq model service</text><text x="838" y="225" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Categorization and extraction</text><text x="838" y="250" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Prompted chat / generation</text><rect x="388" y="370" width="350" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="408" y="406" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">SQLite database</text><text x="408" y="435" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Seeded emails + prompts</text><text x="408" y="460" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Actions + saved drafts</text><rect x="818" y="370" width="410" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="838" y="406" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Processing results</text><text x="838" y="435" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Category / task parsing</text><text x="838" y="460" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Model output requires review</text><rect x="48" y="370" width="260" height="110" rx="6" fill="#f7f9fa" stroke="#dce2e6"/><text x="68" y="406" fill="#17212b" font-size="23" font-weight="600" text-anchor="start">Sample fixtures</text><text x="68" y="435" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Seed emails and prompts</text><text x="68" y="460" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">No live mailbox connector</text><path d="M308,215 L388,215" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M738,215 L818,215" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M563,270 L563,370" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1023,270 L1023,370" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M818,425 L738,425" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M308,425 L388,425" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M425,160 L425,125 L270,125 L270,160" fill="none" stroke="#80909b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="48" y="542" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Selected email content and prompts go to Groq. This demo has no user authentication or tenant isolation.</text><text x="48" y="569" fill="#61707c" font-size="18" font-weight="400" text-anchor="start">Draft CRUD stores user-reviewed text in SQLite; no outbound email delivery is implemented.</text></g></svg>