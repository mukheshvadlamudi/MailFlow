<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">MailFlow workflow overview</title><desc id="desc">Conceptual workflow artwork, not an application screenshot. React + FastAPI + SQLite  ·  Sample-inbox demo  ·  Drafts are not sent as email</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#80909b"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="560" rx="0" fill="#f6f7f5" stroke="#f6f7f5"/><rect x="56" y="48" width="46" height="46" rx="12" fill="#17212b" stroke="#17212b"/><text x="79" y="79" fill="#ffffff" font-size="27" font-weight="600" text-anchor="middle">M</text><text x="118" y="80" fill="#17212b" font-size="27" font-weight="650" text-anchor="start">MailFlow</text><text x="56" y="167" fill="#17212b" font-size="45" font-weight="650" text-anchor="start">Give every email a next step.</text><text x="56" y="211" fill="#61707c" font-size="23" font-weight="400" text-anchor="start">A sample inbox, editable prompts, and a place to review the result.</text><rect x="56" y="270" width="372" height="198" rx="10" fill="#ffffff" stroke="#dce2e6"/><path d="M80 307 h28" stroke="#3879d0" stroke-width="4"/><text x="80" y="341" fill="#61707c" font-size="18" font-weight="600" text-anchor="start">01 / INPUT</text><text x="80" y="383" fill="#17212b" font-size="26" font-weight="600" text-anchor="start">Read the inbox</text><text x="80" y="418" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Seeded emails</text><text x="80" y="445" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Editable prompt templates</text><path d="M432 369 H450" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="454" y="270" width="372" height="198" rx="10" fill="#ffffff" stroke="#dce2e6"/><path d="M478 307 h28" stroke="#3879d0" stroke-width="4"/><text x="478" y="341" fill="#61707c" font-size="18" font-weight="600" text-anchor="start">02 / PROCESS</text><text x="478" y="383" fill="#17212b" font-size="26" font-weight="600" text-anchor="start">Make sense of it</text><text x="478" y="418" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Categorize messages</text><text x="478" y="445" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Extract tasks with Groq</text><path d="M830 369 H848" fill="none" stroke="#80909b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="852" y="270" width="372" height="198" rx="10" fill="#ffffff" stroke="#dce2e6"/><path d="M876 307 h28" stroke="#3879d0" stroke-width="4"/><text x="876" y="341" fill="#61707c" font-size="18" font-weight="600" text-anchor="start">03 / REVIEW</text><text x="876" y="383" fill="#17212b" font-size="26" font-weight="600" text-anchor="start">Keep people in control</text><text x="876" y="418" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Review action items</text><text x="876" y="445" fill="#61707c" font-size="20" font-weight="400" text-anchor="start">Create and edit reply drafts</text><text x="56" y="520" fill="#61707c" font-size="19" font-weight="400" text-anchor="start">React + FastAPI + SQLite  ·  Sample-inbox demo  ·  Drafts are not sent as email</text></g></svg>